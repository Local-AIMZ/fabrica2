<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fábrica AR - Demo Profesional</title>
    
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/build/ar.js"></script>
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Panel de información -->
    <div id="info-panel">
        <h2>🏭 Fábrica Inteligente</h2>
        <p>Apunta la cámara a los marcadores</p>
        <div id="machines-container"></div>
    </div>

    <!-- Botón de inicio -->
    <button id="start-button" onclick="startAR()">📷 Iniciar Cámara AR</button>

    <!-- Loading -->
    <div id="loading">
        <h3>Cargando experiencia AR...</h3>
        <p>Permite el acceso a la cámara</p>
    </div>

    <!-- Escena AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Marcador Hiro -->
        <a-marker preset="hiro" id="marker-hiro">
            <a-box position="0 0.5 0" 
                   material="color: #00ff88; opacity: 0.8"
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
            </a-box>
            
            <a-text value="Maquina CNC-01\nEn Funcionamiento\nTemp: 65C" 
                    position="0 1.5 0" 
                    align="center" 
                    color="#FFFFFF"
                    scale="2 2 2">
            </a-text>
            
            <a-sphere position="0 2.5 0" 
                      radius="0.2" 
                      material="color: #00ff88"
                      animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1000">
            </a-sphere>
        </a-marker>
        
        <!-- Marcador Kanji -->
        <a-marker preset="kanji" id="marker-kanji">
            <a-cylinder position="0 0.75 0" 
                        height="1.5" 
                        radius="0.5"
                        material="color: #ff6600; opacity: 0.8"
                        animation="property: rotation; to: 360 0 0; loop: true; dur: 3000">
            </a-cylinder>
            
            <a-text value="Prensa Hidraulica\nActiva\nPresion: 150bar" 
                    position="0 2 0" 
                    align="center" 
                    color="#FFFFFF"
                    scale="2 2 2">
            </a-text>
        </a-marker>
        
        <!-- Cámara -->
        <a-entity camera></a-entity>
    </a-scene>

    <!-- JavaScript personalizado -->
    <script src="js/app.js"></script>

</body>
</html>
